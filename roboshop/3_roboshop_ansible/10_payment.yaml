---
- name: Install payment components
  hosts: localhost
  become: yes

  vars:
    hosted_zone_id: "Z0733341RBXDY8DMJGHB"
    record_name: "payment.vrpproducts.shop"

  tasks:
    - name: Install Python and build dependencies
      ansible.builtin.dnf:
        name:
          - python3
          - python3-pip
          - gcc
          - python3-devel
        state: installed
        update_cache: yes

    - name: check roboshop user exist or not
      ansible.builtin.shell: id roboshop
      register: out       # output is variable name
      ignore_errors: true


    - name: create user roboshop
      when: out.rc != 0
      become: yes         # we need sudo access for this task
      ansible.builtin.user:
        name: roboshop

    - name: check /app directory exists or not
      ansible.builtin.stat:
        path: /app
      register: directory # directory is variable

    - name: print the directory stats
      ansible.builtin.debug:
        msg: "output: {{ directory }}"
    
    - when: directory.stat.exists == False
      name: Create /app directory
      ansible.builtin.file:
        path: /app
        state: directory

    - name: Download payment artifact
      ansible.builtin.get_url:
        url: https://roboshop-builds.s3.amazonaws.com/payment.zip
        dest: /tmp/payment.zip
    
    - name: extract payment artifact
      ansible.builtin.unarchive:
        src: /tmp/payment.zip
        dest: /app
        remote_src: yes
    
    - name: Installing NPM and dependencies (#npm install)
      ansible.builtin.pip: 
        requirements: /app/requirements.txt

    - name: Setup payment service
      ansible.builtin.copy:
        dest: /etc/systemd/system/payment.service
        content: |
          [Unit]
          Description=Payment Service

          [Service]
          User=root
          WorkingDirectory=/app
          Environment=CART_HOST=cart.vrpproducts.shop
          Environment=CART_PORT=8080
          Environment=USER_HOST=user.vrpproducts.shop
          Environment=USER_PORT=8080
          Environment=AMQP_HOST=rabbitmq.vrpproducts.shop
          Environment=AMQP_USER=roboshop
          Environment=AMQP_PASS=roboshop123

          ExecStart=/usr/local/bin/uwsgi --ini payment.ini
          ExecStop=/bin/kill -9 $MAINPID
          SyslogIdentifier=payment

          [Install]
          WantedBy=multi-user.target

    - name: Daemon reload
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Start and Enable payment service
      ansible.builtin.service:
        name: payment
        state: restarted
        enabled: true
        
    - name: Check AWS CLI availability
      ansible.builtin.shell: |
        if [ -x /usr/local/bin/aws ]; then
          /usr/local/bin/aws --version
        elif [ -x /usr/bin/aws ]; then
          /usr/bin/aws --version
        else
          exit 1
        fi
      register: aws_cli_version
      ignore_errors: true

    - name: Install AWS CLI v2 when missing or broken
      when: aws_cli_version.rc != 0
      ansible.builtin.shell: |
        cd /tmp
        curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
        unzip -o awscliv2.zip
        ./aws/install --update

    - name: Ensure aws executable available under /usr/bin/aws
      ansible.builtin.file:
        src: /usr/local/bin/aws
        dest: /usr/bin/aws
        state: link

    - name: Updating Route53 records
      ansible.builtin.shell: |
        TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" \
          -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")

        PRIVATE_IP=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
          http://169.254.169.254/latest/meta-data/local-ipv4)

        aws route53 change-resource-record-sets \
          --hosted-zone-id {{ hosted_zone_id }} \
          --change-batch "{
            \"Changes\": [{
              \"Action\": \"UPSERT\",
              \"ResourceRecordSet\": {
                \"Name\": \"{{ record_name }}\",
                \"Type\": \"A\",
                \"TTL\": 60,
                \"ResourceRecords\": [{ \"Value\": \"${PRIVATE_IP}\" }]
              }
            }]
          }"

        echo "Updated Public IP Address '${PRIVATE_IP}' for {{ record_name }}"
      register: route53_update_output

    - debug:
        var: route53_update_output.stdout
