---
- name: Install Catalogue components
  hosts: localhost
  become: yes

  vars:
    hosted_zone_id: "Z0733341RBXDY8DMJGHB"
    record_name: "catalogue.vrpproducts.shop"

  tasks:
    - name: Setup the NPM repo
      ansible.builtin.shell: "curl -sL https://rpm.nodesource.com/setup_lts.x | bash"

    - name: Install NodeJS
      ansible.builtin.dnf:
        name: nodejs
        state: installed

    - name: check roboshop user exist or not
      ansible.builtin.command: id roboshop
      register: out       # output is variable name
      ignore_errors: true

    - when: out.rc != 0
      name: create user roboshop
      become: yes         # we need sudo access for this task
      ansible.builtin.user:
        name: roboshop

    - name: check /app directory exists or not
      ansible.builtin.stat:
        path: /app
      register: directory # directory is variable

    - name: print the directory stats
      ansible.builtin.debug:
        msg: "output: {{ directory }}"
    
    - when: directory.stat.exists == False
      name: Create /app directory
      ansible.builtin.file:
        path: /app
        state: directory
        
    - name: Download catalogue artifact
      ansible.builtin.get_url:
        url: https://roboshop-builds.s3.amazonaws.com/catalogue.zip
        dest: /tmp/catalogue.zip
    
    - name: extract catalogue artifac
      ansible.builtin.unarchive:
        src: /tmp/catalogue.zip
        dest: /app
        remote_src: yes
    
    - name: Installing NPM and dependencies
      ansible.builtin.command: npm install
      args:
        chdir: /app

    - name: Setup Catalogue service
      ansible.builtin.copy:
        dest: /etc/systemd/system/catalogue.service
        content: |
          [Unit]
          Description = Catalogue Service

          [Service]
          User=roboshop
          Environment=MONGO=true
          Environment=MONGO_URL="mongodb://mongodb.vrpproducts.shop:27017/catalogue"
          ExecStart=/bin/node /app/server.js
          SyslogIdentifier=catalogue

          [Install]
          WantedBy=multi-user.target
    
    - name: Daemon reload
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: Start and Enable Catalogue service
      ansible.builtin.service:
        name: catalogue
        state: started
        enabled: true

    - name: Setup MongoDB repo
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/mongo.repo
        content: |
          [mongodb-org-7.0]
          name=MongoDB Repository
          baseurl=https://repo.mongodb.org/yum/amazon/2023/mongodb-org/7.0/x86_64/
          gpgcheck=1
          enabled=1
          gpgkey=https://pgp.mongodb.com/server-7.0.asc

    - name: Installing MongoDB
      ansible.builtin.dnf:
        name: mongodb-mongosh
        state: installed
    
    - name: Load Schema
      ansible.builtin.shell: |
        mongosh --host mongodb.vrpproducts.shop < /app/schema/catalogue.js

    - name: Retry Schema load if failure (OpenSSL fix)
      ansible.builtin.shell: |
        CMD_STATUS=$?

        if [[ $CMD_STATUS -ne 0 ]] ; then
            echo -e "\nOpenSSL issue,.. workiing with trouble shooting steps" | tee -a $LOGFILE
            dnf remove mongodb-mongosh -y  | tee -a $LOGFILE
            dnf install mongodb-mongosh-shared-openssl3 -y | tee -a $LOGFILE
            dnf install mongodb-mongosh -y | tee -a $LOGFILE
            mongosh --host mongodb.vrpproducts.shop < /app/schema/catalogue.js | tee -a $LOGFILE
            echo -e "\nLoad Scheme is successfull after troubleshooting. . .\n" | tee -a $LOGFILE 
        else
            echo -e "\nLoad Scheme is successfull. . ." | tee -a $LOGFILE
        fi

    - name: restarting Catalogue Service
      ansible.builtin.service:
        name: catalogue
        state: restarted

    - name: Update Route53 records
      ansible.builtin.shell: |
        TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" \
          -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")

        PRIVATE_IP=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
          http://169.254.169.254/latest/meta-data/local-ipv4)

        aws route53 change-resource-record-sets \
          --hosted-zone-id {{ hosted_zone_id }} \
          --change-batch "{
            \"Changes\": [{
              \"Action\": \"UPSERT\",
              \"ResourceRecordSet\": {
                \"Name\": \"{{ record_name }}\",
                \"Type\": \"A\",
                \"TTL\": 60,
                \"ResourceRecords\": [{ \"Value\": \"${PRIVATE_IP}\" }]
              }
            }]
          }"

        echo "Updated Private IP Address '${PRIVATE_IP}' for {{ record_name }}'"
      register: route53_update_output

    - debug:
        var: route53_update_output.stdout