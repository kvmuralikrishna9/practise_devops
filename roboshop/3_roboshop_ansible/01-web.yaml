---
- name: Installing web components
  hosts: localhost
  become: yes

  vars:
    hosted_zone_id: "Z0733341RBXDY8DMJGHB"
    record_name: "ui.vrpproducts.shop"

  tasks:
    - name: Install Nginx
      ansible.builtin.dnf:
        name: nginx
        state: installed
    
    - name: Start and enable nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: yes
    
    - name: remove default html directory
      ansible.builtin.file:
        path: /usr/share/nginx/html
        state: absent

    - name: remove default html directory
      ansible.builtin.file:
        path: /usr/share/nginx/html
        state: directory

    - name: Download web artifacts
      ansible.builtin.get_url:
        url: https://roboshop-builds.s3.amazonaws.com/web.zip
        dest: /tmp/web.zip

    - name: Extract the frontend content
      ansible.builtin.unarchive:
        src: /tmp/web.zip
        dest: /usr/share/nginx/html
        remote_src: yes

    - name: Copy roboshoh.conf
      ansible.builtin.copy:
        dest: /etc/nginx/default.d/roboshop.conf
        content: |
          proxy_http_version 1.1;
          location /images/ {
            expires 5s;
            root   /usr/share/nginx/html;
            try_files $uri /images/placeholder.jpg;
          }
          location /api/catalogue/ { proxy_pass http://catalogue.vrpproducts.shop:8080/; }
          location /api/user/ { proxy_pass http://user.vrpproducts.shop:8080/; }
          location /api/cart/ { proxy_pass http://cart.vrpproducts.shop:8080/; }
          location /api/shipping/ { proxy_pass http://shipping.vrpproducts.shop:8080/; }
          location /api/payment/ { proxy_pass http://payment.vrpproducts.shop:8080/; }

          location /health {
            stub_status on;
            access_log off;
          }
    
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted

    - name: Updating Route53 records
      ansible.builtin.shell: |
        PUBLIC_IP=$(curl -s http://checkip.amazonaws.com)

        aws route53 change-resource-record-sets \
          --hosted-zone-id {{ hosted_zone_id }} \
          --change-batch "{
            \"Changes\": [{
              \"Action\": \"UPSERT\",
              \"ResourceRecordSet\": {
                \"Name\": \"{{ record_name }}\",
                \"Type\": \"A\",
                \"TTL\": 0,
                \"ResourceRecords\": [{ \"Value\": \"${PUBLIC_IP}\" }]
              }
            }]
          }"

        echo "Updated Public IP Address '${PUBLIC_IP}' for {{ record_name }}"
      register: route53_update_output

    - debug:
        var: route53_update_output.stdout